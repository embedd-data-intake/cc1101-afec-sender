[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/embedd-data-intake/cc1101-afec
    ScioSense_ENS16x
    Adafruit AHTX0
    Adafruit BMP3xx Library
build_flags =
    -D AFEC_LOG_LEVEL=4
    -D AFEC_LOG_FORMAT=1
